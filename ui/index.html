<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MD 笔记</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="light">
  <!-- 三栏：目录区 | 笔记区 | AI 助手区。两条 .gutter 是可拖动的分隔条。 -->
  <div id="app" data-ai="off">
    <aside id="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="brand-mark">MD</span>
          <span>笔记</span>
        </div>
        <button id="btn-theme" class="icon-btn" title="切换明暗（本地预览用）">&#9686;</button>
      </div>

      <div class="side-tools">
        <button id="btn-new-note" class="primary">+ 新建笔记</button>
        <button id="btn-new-folder">+ 文件夹</button>
      </div>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="全文检索标题与正文…" autocomplete="off" />
        <button id="search-clear" class="clear-btn" title="清除检索" hidden>&#215;</button>
      </div>

      <div id="tree" class="tree"></div>

      <div id="sel-actions" class="sel-actions" hidden>
        <button id="btn-rename">重命名</button>
        <button id="btn-move">移动到…</button>
        <button id="btn-delete" class="danger">删除</button>
      </div>

      <div id="side-foot" class="side-foot"></div>
    </aside>

    <div id="gutter-side" class="gutter" role="separator" aria-orientation="vertical" title="拖动调整目录区宽度（双击复位）"></div>

    <main id="main">
      <!-- 置顶诊断条：上线时已关闭（app.js 里 SHOW_DIAG_BAR=false）。
           日后需要排障：把 app.js 的 SHOW_DIAG_BAR 改成 true，并把下面这段取消注释即可。
           <div id="diag-bar" class="diag-bar" data-sev="warn">
             <div class="diag-head">
               <span class="diag-dot"></span>
               <span class="diag-title">存储诊断</span>
               <span id="diag-verdict" class="diag-verdict">正在初始化…</span>
               <span id="diag-summary" class="diag-summary"></span>
               <span class="diag-spacer"></span>
               <button id="diag-toggle" class="diag-btn">收起日志</button>
               <button id="diag-copy" class="diag-btn">复制诊断</button>
               <button id="diag-detail" class="diag-btn">状态详情</button>
             </div>
             <pre id="diag-log" class="diag-log">（等待日志…）</pre>
           </div>
      -->

      <div class="toolbar">
        <input id="title" class="title-input" placeholder="笔记标题" />
        <div class="toolbar-right">
          <button id="btn-table-note">为表新建笔记</button>
          <button id="btn-insert-sql">插入 SQL 块</button>
          <button id="btn-ai" title="打开 / 收起右侧 AI 助手栏（Ctrl/Cmd+I）">AI 助手</button>
          <!-- <button id="btn-copy-sql">复制 SQL 到 DBX</button> -->
          <span class="sep"></span>
          <button id="btn-export-md">导出 .md</button>
          <!-- 导入功能暂时下线（app.js 里 ENABLE_IMPORT=false）。
               恢复：把 app.js 的 ENABLE_IMPORT 改成 true，并把下面两处取消注释。 -->
          <!-- <button id="btn-import-md">导入 .md</button> -->
          <button id="btn-backup-zip">备份 zip</button>
          <button id="btn-restore-zip">恢复备份…</button>
        </div>
      </div>

      <div id="panes" class="panes" data-view="split" data-empty="1">
        <textarea id="editor" class="editor" placeholder="在此输入 Markdown…（支持标题、列表、代码块、表格、加粗、引用；```sql 代码块会高亮）" spellcheck="false"></textarea>
        <div id="preview" class="preview markdown-body"></div>
        <div id="empty" class="empty">
          <div class="empty-card">
            <div class="empty-mark">📝</div>
            <h2>开始记录你的第一篇笔记</h2>
            <p>在左侧选择一条笔记，或新建一篇开始。</p>
            <button id="btn-empty-new" class="primary big">+ 新建笔记</button>
          </div>
        </div>
      </div>

      <div class="statusbar">
        <span id="store-status" class="store-status"><span class="store-dot"></span><span id="store-text">存储检测中…</span></span>
        <span id="note-meta" class="note-meta"></span>
        <span class="spacer"></span>
        <span class="view-switch" id="view-switch">
          <button data-view="edit">编辑</button>
          <button data-view="split" class="on">双栏</button>
          <button data-view="preview">预览</button>
        </span>
        <span id="counter" class="counter">0 字</span>
      </div>
    </main>

    <div id="gutter-ai" class="gutter" role="separator" aria-orientation="vertical" title="拖动调整 AI 助手宽度（双击复位）"></div>

    <!-- AI 助手：常驻右栏（不是弹窗）。结果只在用户点「插入/替换/追加」时才写回笔记。 -->
    <aside id="ai-panel" class="ai-panel" hidden>
      <div class="aip-head">
        <span class="aip-brand">AI 助手</span>
        <span id="aip-model" class="aip-model"></span>
        <button id="aip-cfg-toggle" class="icon-btn" title="配置 / 更新 AI 模型">&#9881;</button>
        <button id="aip-clear-log" class="icon-btn" title="清空对话记录">&#9851;</button>
        <button id="aip-close" class="icon-btn" title="收起（Ctrl/Cmd+I）">&#10005;</button>
      </div>

      <!-- 配置区：默认收起。改完点「保存」后长期有效（密钥默认只在本次会话内有效）。 -->
      <div id="aip-cfg" class="aip-cfg" hidden>
        <label class="aip-check">
          <input id="aip-enabled" type="checkbox" />
          <span>启用 AI 功能</span>
        </label>
        <label class="m-label" for="aip-provider">服务类型</label>
        <select id="aip-provider" class="m-input">
          <option value="openai">OpenAI 兼容（DeepSeek / 通义 / Kimi / 自建网关）</option>
          <option value="anthropic">Anthropic（Claude）</option>
          <option value="ollama">Ollama（本地模型，无需密钥）</option>
        </select>
        <label class="m-label" for="aip-baseurl">API 地址</label>
        <input id="aip-baseurl" class="m-input" placeholder="https://api.deepseek.com/v1" autocomplete="off" />
        <label class="m-label" for="aip-modelinput">模型名称</label>
        <input id="aip-modelinput" class="m-input" placeholder="deepseek-chat" autocomplete="off" />
        <label class="m-label" for="aip-key">API 密钥</label>
        <input id="aip-key" class="m-input" type="password" placeholder="留空 = 不修改已保存的密钥" autocomplete="off" />
        <label class="aip-check">
          <input id="aip-remember" type="checkbox" />
          <span>在本机记住密钥（明文存放在本机插件数据目录，非共享电脑再勾选）</span>
        </label>
        <label class="m-label" for="aip-sysprompt">自定义人设（可选）</label>
        <textarea id="aip-sysprompt" class="m-text" placeholder="留空则使用内置的写作助手人设"></textarea>
        <div class="aip-2col">
          <label><span class="m-label">单次超时（秒）</span><input id="aip-timeout" class="m-input" type="number" min="5" max="300" /></label>
          <label><span class="m-label">单次送入上限（字符）</span><input id="aip-maxchars" class="m-input" type="number" min="500" max="200000" /></label>
        </div>
        <div class="aip-cfg-actions">
          <button id="aip-test">测试连接</button>
          <button id="aip-save" class="primary">保存</button>
          <button id="aip-clear">清除本机配置</button>
        </div>
        <div id="aip-cfg-msg" class="aip-msg"></div>
      </div>

      <div id="aip-scope" class="aip-scope"></div>
      <div id="aip-tabs" class="aip-tabs"></div>

      <div id="aip-log" class="aip-log">
        <div class="aip-hint">
          选择一种任务后点下方按钮。<br />
          有选中文本时只处理选中部分，否则处理整篇笔记。<br />
          结果不会自动写回 —— 由你选择「插入到光标 / 替换选中 / 追加到末尾 / 复制」。
        </div>
      </div>

      <div class="aip-compose">
        <textarea id="aip-input" class="aip-input" placeholder="（可选）额外要求 / 你的问题"></textarea>
        <div class="aip-compose-bar">
          <span id="aip-status" class="aip-status"></span>
          <button id="aip-go" class="primary">开始分析</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 通用弹窗：重命名 / 确认 / 移动 / 导出降级 -->
  <div id="modal" class="modal" hidden></div>

  <!-- 目录树右键菜单 -->
  <div id="ctx-menu" class="ctx-menu" hidden></div>

  <!-- 从表新建笔记 -->
  <div id="table-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>为此表新建笔记</h3>
      <label class="m-label">表名</label>
      <input id="tn-table" class="m-input" placeholder="例如 users" />
      <label class="m-label">字段清单（每行一个，可写 “列名 类型”）</label>
      <textarea id="tn-fields" class="m-text" placeholder="id bigint&#10;name varchar(64)&#10;created_at timestamp"></textarea>
      <label class="m-label">保存到</label>
      <select id="tn-folder" class="m-input"></select>
      <div class="modal-actions">
        <button id="tn-cancel">取消</button>
        <button id="tn-ok" class="primary">创建</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <!-- <input id="file-input" type="file" accept=".md,.markdown,.txt" multiple hidden /> -->
  <input id="backup-input" type="file" accept=".zip" hidden />

  <script src="sql-highlight.js"></script>
  <script src="markdown.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
